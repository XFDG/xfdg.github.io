name: Correct cross-platform publishing wording

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-publishing-wording.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct wording and commit only the page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('writing.html')
          text = p.read_text(encoding='utf-8')
          old = '本站负责沉淀项目档案、实验摘要与长期写作目录；完整工程长文同步发布到 CSDN，适合讨论与观点交流的内容发布到知乎。文章仍围绕系统背景、执行路径、指标、实验和结论边界组织。'
          new = '本站负责沉淀项目档案、实验摘要与长期写作目录；完整工程长文适合整理为 CSDN 工程版，机制解释与观点内容适合整理为知乎版本。文章仍围绕系统背景、执行路径、指标、实验和结论边界组织。'
          if old not in text:
              raise SystemExit('target wording not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing.html
          git commit -m 'Clarify CSDN and Zhihu publishing status'
          git push origin HEAD:main
