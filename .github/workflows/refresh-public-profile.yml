name: Refresh public profile

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-public-profile.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bilingual-portfolio
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify merged PRs and update reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/refresh-profile.py
          # Workflow changes are applied separately through the authorized connection.
          git restore .github/workflows/build-bilingual-site.yml
      - name: Install build dependencies
        run: python -m pip install -r tools/blog-requirements.txt
      - name: Build and test both languages
        run: |
          python tools/build_blog.py --test
          python tools/build_portfolio.py
          python tools/build_blog.py
          python tools/check_portfolio.py
          python tools/check_blog.py
          node --check script.js
          node --check assets/blog/blog.js
          python - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          status=json.loads(Path('content/portfolio_status.json').read_text())
          assert 'tracked_open' not in status
          assert all(p['state']=='merged' and p['merged_at'] for g in status['groups'] for p in g['prs'])
          for prefix in ('','en/'):
              for name in ('opensource.html','projects/mooncake-contributions.html'):
                  text=Path(prefix+name).read_text()
                  assert '3661' not in text and 'Under review' not in text and 'Ongoing work' not in text
              text=Path(prefix+'resume.html').read_text()
              assert 'anonymous-zh.pdf' in text and 'anonymous-en.pdf' in text
              assert not re.search(r'(?<![0-9])1[3-9][0-9]{9}(?![0-9])',text)
              assert '结果范围' not in Path(prefix+'projects/iquest-q1.html').read_text()
          for lang in ('zh','en'):
              text=Path('assets/resume/anonymous-'+lang+'.md').read_text()
              assert not any(t in text for t in ['冯浩然','Haoran Feng','XFDG','IQuest','九坤','至知','Moore','摩尔','山东大学','中文大学','openreview','github.com','@'])
              assert not re.search(r'(?<![0-9])1[3-9][0-9]{9}(?![0-9])',text)
          def snapshot():
              paths=list(Path('.').rglob('*.html'))+list(Path('assets/resume').glob('*'))
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if '.git' not in p.parts}
          before=snapshot()
          subprocess.run(['python','tools/build_portfolio.py'],check=True)
          subprocess.run(['python','tools/build_blog.py'],check=True)
          assert before==snapshot(), 'Non-deterministic site or resume build'
          print('PASS: merged-only lists, anonymous identifiers, downloads and repeatable build')
          PY
      - name: Publish reviewed sources and generated files
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Concurrent edit detected; refusing to overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/refresh-profile.py
          git add tools/build_portfolio.py tools/build_anonymous_resume.py tools/blog-requirements.txt tools/check_portfolio.py tools/check_live_site.py content/portfolio_status.json assets/resume '*.html' en projects blog sitemap.xml
          git diff --cached --check
          git commit -m 'Update public resume, anonymous downloads and merged-only upstream PRs'
          git push origin HEAD:main
          echo "Published commit: $(git rev-parse HEAD)"
      - name: Deploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify public pages and PDFs
        run: |
          python tools/check_live_site.py --timeout 240
          python tools/check_blog.py --live --timeout 180
      - name: Export review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-profile-review
          retention-days: 1
          path: |
            *.html
            portfolio.css
            styles.css
            script.js
            en/
            projects/
            blog/
            admin/
            assets/
            tools/
            content/portfolio_status.json
