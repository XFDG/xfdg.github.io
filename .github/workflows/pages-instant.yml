name: Verify public website content

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-instant.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify root and writing pages
        shell: bash
        run: |
          set -euo pipefail
          root_status="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' https://xfdg.github.io/ || true)"
          writing_status="$(curl -L -sS -o /tmp/writing.html -w '%{http_code}' https://xfdg.github.io/writing.html || true)"
          contains_haoran=false; contains_csdn=false; contains_zhihu=false; writing_channels=false
          [[ "$root_status" == 200 ]] && grep -q 'Haoran Feng' /tmp/index.html && contains_haoran=true
          grep -q 'blog.csdn.net/XFDG01' /tmp/index.html && contains_csdn=true
          grep -q 'zhihu.com/people/xian-feng-dao-gu-73-49' /tmp/index.html && contains_zhihu=true
          [[ "$writing_status" == 200 ]] && grep -q 'Publishing Channels / 发布渠道' /tmp/writing.html && writing_channels=true
          verified=false
          [[ "$contains_haoran" == true && "$contains_csdn" == true && "$contains_zhihu" == true && "$writing_channels" == true ]] && verified=true
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n --argjson verified "$verified" --arg root_status "$root_status" --arg writing_status "$writing_status" \
            --argjson contains_haoran "$contains_haoran" --argjson contains_csdn "$contains_csdn" \
            --argjson contains_zhihu "$contains_zhihu" --argjson writing_channels "$writing_channels" \
            --arg checked_at "$checked_at" \
            '{verified:$verified,root_status:$root_status,writing_status:$writing_status,contains_haoran:$contains_haoran,contains_csdn:$contains_csdn,contains_zhihu:$contains_zhihu,writing_channels:$writing_channels,checked_at:$checked_at}' > live-verification.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-verification.json
          git commit -m 'Record live website verification [skip ci]'
          git push origin HEAD:main
          [[ "$verified" == true ]]
