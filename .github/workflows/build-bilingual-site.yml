name: Build bilingual site

on:
  push:
    branches: [main]
    paths:
      - tools/build_bilingual.py
      - tools/sync_profile_status.py
      - .github/workflows/build-bilingual-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate bilingual pages
        run: |
          python tools/build_bilingual.py
          python tools/sync_profile_status.py
          python - <<'PY'
          from pathlib import Path
          p = Path('experience.html')
          text = p.read_text(encoding='utf-8')
          old = '<p>围绕 H200 上的大模型训练推理链路；现已具备 Blackwell 实机环境，用于后续跨代验证。完成 CUDA Graph 稳定性根因定位、MoE Router Replay、异步 GPU 状态算子、Grouped GEMM workload 重建与离线推理交付。</p>'
          new = '<p>围绕 H200 上的大模型训练推理链路，完成 CUDA Graph 稳定性根因定位、MoE Router Replay、异步 GPU 状态算子、Grouped GEMM workload 重建与离线推理交付。现已具备 Blackwell 实机环境，用于后续跨代验证。</p>'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated bilingual site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en index.html 404.html projects.html experience.html writing.html contact.html resume.html research.html roadmap.html projects script.js styles.css sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Refresh OSS status and Blackwell access'
            git push origin HEAD:main
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
