name: Build bilingual site

on:
  push:
    branches: [main]
    paths:
      - tools/build_bilingual.py
      - .github/workflows/build-bilingual-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate English mirror and language switch
        run: python tools/build_bilingual.py

      - name: Commit generated bilingual site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en index.html 404.html projects.html experience.html writing.html contact.html resume.html research.html roadmap.html projects script.js styles.css sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Add complete Chinese-English site switch'
            git push origin HEAD:main
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
