name: Build bilingual site

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'content/**'
      - 'portfolio.css'
      - 'script.js'
      - '.github/workflows/build-bilingual-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bilingual-portfolio
  cancel-in-progress: false

jobs:
  build-bilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate both languages
        run: |
          python -m py_compile tools/build_portfolio.py tools/check_portfolio.py tools/check_live_site.py
          python tools/build_portfolio.py
          python tools/check_portfolio.py
          node --check script.js
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          def snapshot():
              return {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('.').rglob('*.html') if '.git' not in p.parts}
          before = snapshot()
          subprocess.run(['python', 'tools/build_portfolio.py'], check=True)
          assert before == snapshot(), 'Bilingual generation is not idempotent'
          print('PASS: repeat generation is byte-identical')
          PY

      - name: Publish generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'en' 'projects' 'sitemap.xml'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish IQuest-Q1 portfolio and verified open-source contributions'
            git push origin HEAD:main
          fi
          echo "Published content commit: $(git rev-parse HEAD)"

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify the public site matches the generated content
        run: python tools/check_live_site.py --timeout 240
