name: Retry compact redesign with corrected validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-compact-redesign.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: compact-portfolio-redesign-retry
  cancel-in-progress: false

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML tooling
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Correct validation and generate pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/compact_redesign.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assert "MERGED" in mooncake_text and "Under Review" not in mooncake_text',
              'assert "MERGED" in mooncake_text\nassert "审阅中的修复" in mooncake_text',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/compact_redesign.py

      - name: Validate claims and compact information architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path('.')
          checks = {
              'index.html': ['Mooncake', '2 merged', 'Selected work', 'Latest open-source activity'],
              'projects.html': ['Mooncake', 'OPEN SOURCE', 'work-list'],
              'projects/mooncake-contributions.html': ['#3660', '#3604', 'MERGED', '#3726', '审阅中的修复'],
              'experience.html': ['Open Source / 开源贡献', 'Mooncake'],
              'resume.html': ['Mooncake Contributor', '2 个 PR 已合并'],
              'styles.css': ['COMPACT-REDESIGN-2026', '.work-row', '.compact-hero'],
          }
          for path, terms in checks.items():
              text = (root / path).read_text(encoding='utf-8')
              for term in terms:
                  assert term in text, f'{path} missing {term}'
          for path in root.rglob('*.html'):
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              assert soup.body and 'compact-site' in soup.body.get('class', []), path
          public = '\n'.join((root / p).read_text(encoding='utf-8') for p in checks if p.endswith('.html'))
          assert 'Mooncake maintainer' not in public
          assert 'all PRs merged' not in public
          print('compact redesign validated')
          PY

      - name: Commit website update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.html experience.html resume.html styles.css sitemap.xml projects/mooncake-contributions.html scripts/compact_redesign.py
          git commit -m 'Redesign portfolio and add Mooncake contributions'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
