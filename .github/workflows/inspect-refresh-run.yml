name: Inspect portfolio refresh workflow state

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-refresh-run.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record refresh workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            --jq '{checked_at: now|todate, runs: [.workflow_runs[] | select(.name == "Refresh portfolio from public engineering evidence") | {id, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > refresh-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refresh-status.json
          git commit -m 'Record portfolio refresh workflow state [skip ci]'
          git push origin HEAD:main
