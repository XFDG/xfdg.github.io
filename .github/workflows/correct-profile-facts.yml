name: Correct portfolio facts and add research submission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-profile-facts.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Correct facts and add research section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, NavigableString

          ROOT = Path('.')
          OPENREVIEW = 'https://openreview.net/forum?id=6eDZdA6IGW'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def soup(path):
              return BeautifulSoup(read(path), 'html.parser')

          def save(path, doc):
              write(path, str(doc))

          def make_fact(doc, label, value):
              div = doc.new_tag('div')
              dt = doc.new_tag('dt'); dt.string = label
              dd = doc.new_tag('dd'); dd.string = value
              div.extend([dt, dd])
              return div

          def make_metric(doc, value, label):
              div = doc.new_tag('div')
              strong = doc.new_tag('strong'); strong.string = value
              span = doc.new_tag('span'); span.string = label
              div.extend([strong, span])
              return div

          def make_os_link(doc, href, title, summary, tail, external=False):
              attrs = {'href': href}
              if external:
                  attrs.update({'target': '_blank', 'rel': 'noopener noreferrer'})
              a = doc.new_tag('a', attrs=attrs)
              strong = doc.new_tag('strong'); strong.string = title
              span = doc.new_tag('span'); span.string = summary
              b = doc.new_tag('b'); b.string = tail
              a.extend([strong, span, b])
              return a

          # Correct the Moore Threads internship dates everywhere they are shown.
          for path in ROOT.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('2026.02 — 2026.05', '2026.01 — 2026.04')
              text = text.replace('2026.02 - 2026.05', '2026.01 - 2026.04')
              path.write_text(text, encoding='utf-8')

          # Homepage: surface the paper and keep independent open source focused on Mooncake.
          doc = soup('index.html')
          facts = doc.select_one('.hero-facts')
          if facts:
              facts.clear()
              for label, value in [
                  ('Current', '大模型系统与高性能计算工程实践'),
                  ('Focus', 'LLM Systems · CUDA · RDMA · MoE'),
                  ('Research', 'AAAI 2027 submission · CoT Distillation'),
                  ('Open source', 'Mooncake · 2 merged upstream PRs'),
              ]:
                  facts.append(make_fact(doc, label, value))

          metrics = doc.select_one('.metric-strip')
          if metrics:
              metrics.clear()
              for value, label in [
                  ('2', 'Mooncake merged PRs'),
                  ('1', 'AAAI 2027 submission'),
                  ('8×H200', 'MoE-RL 主实验环境'),
                  ('1,024', 'GEMM forward ranges'),
              ]:
                  metrics.append(make_metric(doc, value, label))

          two_col = doc.select_one('.two-column-dense')
          if two_col:
              columns = two_col.find_all('div', recursive=False)
              if len(columns) >= 2:
                  right = columns[1]
                  heading = right.select_one('.dense-heading')
                  if heading:
                      h2 = heading.find('h2')
                      if h2: h2.string = 'Research & open source'
                      label = heading.find('span')
                      if label: label.string = 'Public evidence'
                  listing = right.select_one('.os-list')
                  if listing:
                      listing.clear()
                      listing.append(make_os_link(
                          doc, OPENREVIEW,
                          'From Structure to Preference',
                          'AAAI 2027 投稿中 · Token-weighted Chain-of-Thought Distillation · 共同作者',
                          'OpenReview ↗', True
                      ))
                      listing.append(make_os_link(
                          doc, 'projects/mooncake-contributions.html',
                          'Mooncake',
                          '2 个 RDMA 生命周期与故障恢复修复已合入上游',
                          'Evidence ↗'
                      ))
          save('index.html', doc)

          # Project index: MUSA is internship engineering evidence, not a separate OSS identity.
          doc = soup('projects.html')
          musa = doc.find('a', href='projects/musa-extension.html')
          if musa:
              cats = [c for c in (musa.get('data-category') or '').split() if c != 'opensource']
              musa['data-category'] = ' '.join(cats)
              badge = musa.select_one('.work-badge')
              if badge: badge.string = 'FRAMEWORK'
              desc = musa.select_one('.work-main small')
              if desc:
                  desc.string = '摩尔线程实习期间负责 TensorFlow MUSA 后端、算子、Fusion、HostMemory、稳定性与 Kernel 调试工具。'
          drone = doc.find('a', href='projects/drone-detection-pipeline.html')
          if drone:
              title = drone.select_one('.work-main strong')
              if title: title.string = '无人机检测：171K 样本数据工程与多 GPU 实验流水线'
              desc = drone.select_one('.work-main small')
              if desc:
                  desc.string = '统一三套数据集，构建六模型实验、多 GPU 调度、断点恢复与可追溯结果汇总。'
          save('projects.html', doc)

          # Experience page: add research, keep the OSS section Mooncake-only.
          doc = soup('experience.html')
          open_section = doc.find('section', id='open-source-contributions')
          if open_section:
              listing = open_section.select_one('.os-list')
              if listing:
                  for a in list(listing.find_all('a', recursive=False)):
                      if 'TensorFlow MUSA' in a.get_text(' ', strip=True):
                          a.decompose()
              heading = open_section.find('h2')
              if heading: heading.string = 'Accepted upstream contributions.'

              if not doc.find('section', id='research-submission'):
                  fragment = BeautifulSoup(f'''
                  <section class="section section-line dense-section" id="research-submission">
                    <div class="shell">
                      <div class="section-head">
                        <div><span class="section-kicker">Research / 论文</span><h2>Chain-of-Thought Distillation</h2></div>
                        <p>投稿状态与实验结果按 OpenReview 当前公开版本表述，不暗示录用。</p>
                      </div>
                      <div class="os-list os-list-wide">
                        <a href="{OPENREVIEW}" target="_blank" rel="noopener noreferrer">
                          <strong>From Structure to Preference: Token Weighting for Chain-of-Thought Distillation in Large Language Models</strong>
                          <span>AAAI 2027 投稿中（修订版已提交）· 共同作者。提出结构恢复、干预式 token 重要性加权监督与 DPO 的三阶段框架；Qwen2.5-7B-Instruct 在 GSM8K / SVAMP 上达到 94.01% / 94.00%。</span>
                          <b>OpenReview ↗</b>
                        </a>
                      </div>
                    </div>
                  </section>
                  ''', 'html.parser').section
                  open_section.insert_before(fragment)
          save('experience.html', doc)

          # Resume: add research entry and reserve Open Source for independent upstream work.
          doc = soup('resume.html')
          profile = doc.select_one('.resume-section p')
          if profile and 'AAAI 2027' not in profile.get_text():
              profile.string = profile.get_text(strip=True) + ' 共同参与一篇 AAAI 2027 在投稿件，研究结构化与 token 加权的 Chain-of-Thought 蒸馏。'

          open_section = doc.find('section', id='resume-open-source')
          if open_section:
              for entry in list(open_section.select('.resume-entry')):
                  h3 = entry.find('h3')
                  if h3 and 'TensorFlow MUSA' in h3.get_text(' ', strip=True):
                      entry.decompose()

              if not doc.find('section', id='resume-research'):
                  fragment = BeautifulSoup(f'''
                  <section class="resume-section" id="resume-research">
                    <h2>Research</h2>
                    <div class="resume-entry">
                      <div class="resume-entry-head">
                        <div><h3><a href="{OPENREVIEW}" target="_blank" rel="noopener noreferrer">From Structure to Preference: Token Weighting for Chain-of-Thought Distillation in Large Language Models</a></h3><span class="sub">AAAI 2027 Submission · Under Review · Co-author</span></div>
                        <span class="date">2026</span>
                      </div>
                      <ul>
                        <li>提出“结构恢复 → 干预式 token 重要性加权 SFT → DPO”三阶段 CoT 蒸馏框架，区分答案关键推理 token 与冗余解释内容。</li>
                        <li>Qwen2.5-7B-Instruct 在 GSM8K / SVAMP 上达到 94.01% / 94.00%，较文中最强基线分别提升 5.51 / 10.10 个百分点；论文仍处于投稿审阅阶段。</li>
                      </ul>
                    </div>
                  </section>
                  ''', 'html.parser').section
                  open_section.insert_before(fragment)
          save('resume.html', doc)

          # Drone detection page: remove course-name framing from all visible text.
          doc = soup('projects/drone-detection-pipeline.html')
          for node in list(doc.find_all(string=True)):
              if not isinstance(node, NavigableString) or node.parent.name in {'script', 'style'}:
                  continue
              new = str(node).replace('课程项目', '实验工程').replace('课程设计', '工程实验')
              new = new.replace('ICS6201', 'project-root')
              if new != str(node):
                  node.replace_with(new)
          if doc.title:
              doc.title.string = '无人机检测：171K 样本数据工程与多 GPU 实验流水线 — Haoran Feng'
          breadcrumb = doc.select_one('.detail-breadcrumbs span:last-child')
          if breadcrumb:
              breadcrumb.string = '无人机检测：171K 样本数据工程与多 GPU 实验流水线'
          h1 = doc.select_one('.detail-hero h1 .gradient-text')
          if h1:
              h1.string = '无人机检测：171K 样本数据工程与多 GPU 实验流水线'
          status = None
          for meta in doc.select('.detail-meta'):
              label = meta.find('span')
              if label and label.get_text(strip=True) == 'Status':
                  status = meta.find('strong')
                  break
          if status:
              status.string = '实验工程 · 核心训练与评测流水线完成'
          source_title = doc.select_one('.source-banner h2')
          if source_title:
              source_title.string = '以下正文来自公开脱敏工程文档。'
          save('projects/drone-detection-pipeline.html', doc)

          # MUSA page: correct period and describe public PRs as internship engineering evidence.
          doc = soup('projects/musa-extension.html')
          for meta in doc.select('.detail-meta'):
              label = meta.find('span')
              value = meta.find('strong')
              if not label or not value:
                  continue
              if label.get_text(strip=True) == 'Period':
                  value.string = '2026.01 — 2026.04'
              elif label.get_text(strip=True) == 'Evidence':
                  value.string = 'Public engineering records + benchmarks'
          for h in doc.find_all(['h2', 'strong']):
              if h.get_text(strip=True) == '公开贡献状态说明':
                  h.string = '公开工程记录说明'
          save('projects/musa-extension.html', doc)

          # Validation.
          all_html = '\n'.join(p.read_text(encoding='utf-8') for p in ROOT.rglob('*.html'))
          assert '2026.02 — 2026.05' not in all_html
          assert '2026.01 — 2026.04' in all_html
          assert 'AAAI 2027 投稿中' in read('index.html')
          assert 'From Structure to Preference' in read('resume.html')
          assert 'TensorFlow MUSA Extension Contributor' not in read('resume.html')
          exp_open = soup('experience.html').find('section', id='open-source-contributions')
          assert exp_open and 'Mooncake' in exp_open.get_text(' ', strip=True)
          assert 'TensorFlow MUSA' not in exp_open.get_text(' ', strip=True)
          assert 'ICS6201 无人机' not in read('projects.html')
          assert '课程项目' not in read('projects/drone-detection-pipeline.html')
          assert '课程设计' not in read('projects/drone-detection-pipeline.html')
          assert '无人机检测：171K 样本数据工程与多 GPU 实验流水线' in read('projects/drone-detection-pipeline.html')
          print('portfolio facts corrected and research submission added')
          PY

      - name: Validate internal links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          root = Path('.')
          missing = []
          for page in root.rglob('*.html'):
              doc = BeautifulSoup(page.read_text(encoding='utf-8'), 'html.parser')
              for node in doc.find_all(['a','img','script','link']):
                  target = node.get('href') or node.get('src')
                  if not target or target.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  parsed = urlsplit(target)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  candidate = (page.parent / parsed.path).resolve()
                  if parsed.path.endswith('/'):
                      candidate /= 'index.html'
                  if not candidate.exists():
                      missing.append(f'{page}: {target}')
          assert not missing, '\n'.join(missing)
          print('internal links valid')
          PY

      - name: Commit corrected public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.html experience.html resume.html \
                  projects/drone-detection-pipeline.html projects/musa-extension.html
          git commit -m 'Correct profile facts and add AAAI 2027 submission'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
