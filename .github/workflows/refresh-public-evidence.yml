name: Refresh portfolio from public engineering evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-public-evidence.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-public-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document tooling
        run: python -m pip install --disable-pip-version-check markdown beautifulsoup4

      - name: Read the redacted evidence branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ics6201-evidence
          git clone --depth 1 --branch me https://github.com/XFDG/ICS6201.git /tmp/ics6201-evidence

      - name: Rebuild evidence-led portfolio pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import html
          import re
          from pathlib import Path
          from urllib.parse import quote, urlsplit

          from bs4 import BeautifulSoup
          from markdown import markdown

          ROOT = Path('.')
          EVIDENCE = Path('/tmp/ics6201-evidence')
          SITE = 'https://xfdg.github.io/'
          GITHUB = 'https://github.com/XFDG'
          CSDN = 'https://blog.csdn.net/XFDG01'
          ZHIHU = 'https://www.zhihu.com/people/xian-feng-dao-gu-73-49'
          SOURCE_ROOT = 'https://github.com/XFDG/ICS6201/blob/me/'

          def read(path: str) -> str:
              return (EVIDENCE / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def source_url(path: str) -> str:
              return SOURCE_ROOT + '/'.join(quote(p) for p in path.split('/'))

          def prepare_markdown(text: str, heading: str | None = None) -> str:
              text = re.sub(r'^#\s+.*?\n', '', text, count=1)
              text = re.sub(r'(?m)^#\s+', '## ', text)
              text = re.sub(r'(?m)^##\s+', '### ', text)
              text = re.sub(r'(?m)^###\s+', '#### ', text)
              text = re.sub(r'!\[[^\]]*\]\([^\)]+\)', '', text)
              text = text.replace('/path/to/', '[redacted-path]/')
              if heading:
                  text = f'## {heading}\n\n{text}'
              return text

          def md_html(text: str, base_source_path: str) -> str:
              rendered = markdown(text, extensions=['extra', 'tables', 'fenced_code', 'sane_lists'])
              soup = BeautifulSoup(rendered, 'html.parser')
              base_dir = base_source_path.rsplit('/', 1)[0]
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if href.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  clean = href.split('#', 1)[0]
                  if not clean:
                      continue
                  joined = str(Path(base_dir, clean)).replace('\\', '/')
                  a['href'] = source_url(joined)
                  a['target'] = '_blank'
                  a['rel'] = 'noopener noreferrer'
              for img in soup.find_all('img'):
                  img.decompose()
              return str(soup)

          NAV = '''
          <header class="site-header">
            <div class="shell header-inner">
              <a class="brand" href="../index.html" aria-label="返回首页"><span class="brand-mark">HF</span><span class="brand-copy">Haoran Feng <small>AI Infra Lab</small></span></a>
              <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span></button>
              <nav class="site-nav" aria-label="主导航">
                <a href="../index.html" data-nav="home">首页</a><a href="../experience.html" data-nav="experience">经历</a><a href="../projects.html" data-nav="projects">项目</a><a href="../writing.html" data-nav="writing">文章</a><a href="../roadmap.html" data-nav="roadmap">Roadmap</a><a href="../contact.html" data-nav="contact">联系</a><a class="nav-cta" href="../resume.html" data-nav="resume">公开简历</a>
              </nav>
            </div>
          </header>'''

          FOOTER = f'''
          <footer class="site-footer"><div class="shell footer-inner"><span>© <span data-year></span> Haoran Feng. Evidence-led AI Infra portfolio.</span><div class="footer-links"><a href="mailto:225010160@link.cuhk.edu.cn">Email</a><a href="{GITHUB}" target="_blank" rel="noreferrer">GitHub</a><a href="{CSDN}" target="_blank" rel="me noopener noreferrer">CSDN</a><a href="{ZHIHU}" target="_blank" rel="me noopener noreferrer">知乎</a><a href="../resume.html">Resume</a></div></div></footer>'''

          def metric_cards(metrics: list[tuple[str, str, str]]) -> str:
              return ''.join(
                  f'<div class="metric-card"><strong>{html.escape(value)}</strong><span>{html.escape(label)}</span><small>{html.escape(note)}</small></div>'
                  for value, label, note in metrics
              )

          def architecture(items: list[tuple[str, str]]) -> str:
              return '<div class="architecture">' + ''.join(
                  f'<div class="arch-node"><strong>{html.escape(title)}</strong><span>{html.escape(detail)}</span></div>'
                  for title, detail in items
              ) + '</div>'

          def project_page(*, slug: str, title: str, eyebrow: str, lead: str,
                           role: str, environment: str, stack: str, status: str,
                           metrics: list[tuple[str, str, str]],
                           architecture_items: list[tuple[str, str]],
                           documents: list[tuple[str, str, str]],
                           figures: list[tuple[str, str]],
                           boundary: str) -> None:
              source_buttons = ''.join(
                  f'<a class="button small" href="{source_url(path)}" target="_blank" rel="noopener noreferrer">{html.escape(label)} ↗</a>'
                  for label, path, _ in documents
              )
              sections = []
              for label, path, heading in documents:
                  body = prepare_markdown(read(path), heading)
                  sections.append(f'<section class="evidence-section">{md_html(body, path)}</section>')
              figure_html = ''.join(
                  f'<figure class="project-figure"><img src="../{src}" alt="{html.escape(caption)}" loading="lazy"><figcaption>{html.escape(caption)} · 公开脱敏图</figcaption></figure>'
                  for src, caption in figures
              )
              content = f'''<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{html.escape(lead)}"><meta name="theme-color" content="#07090d"><link rel="canonical" href="{SITE}projects/{slug}.html"><title>{html.escape(title)} — Haoran Feng</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../styles.css"><script src="../script.js" defer></script></head>
          <body data-page="projects" class="evidence-page">{NAV}
          <main>
            <section class="detail-hero"><div class="shell"><div class="detail-breadcrumbs reveal"><a href="../projects.html">Projects</a><span>/</span><span>{html.escape(title)}</span></div><span class="eyebrow reveal">{html.escape(eyebrow)}</span><h1 class="reveal"><span class="gradient-text">{html.escape(title)}</span></h1><p class="detail-lead reveal">{html.escape(lead)}</p><div class="detail-meta-grid reveal"><div class="detail-meta"><span>Role</span><strong>{html.escape(role)}</strong></div><div class="detail-meta"><span>Environment</span><strong>{html.escape(environment)}</strong></div><div class="detail-meta"><span>Stack</span><strong>{html.escape(stack)}</strong></div><div class="detail-meta"><span>Status</span><strong>{html.escape(status)}</strong></div></div></div></section>
            <section class="section compact section-line"><div class="shell detail-layout"><article class="detail-content">
              <section><span class="section-kicker">Evidence Snapshot / 证据快照</span><h2>用可复核的数字描述贡献，也明确数字不能证明什么。</h2><div class="metric-grid">{metric_cards(metrics)}</div></section>
              <section><span class="section-kicker">System / 系统链路</span><h2>从问题到验证的工程闭环</h2>{architecture(architecture_items)}</section>
              {figure_html}
              <section class="source-banner"><div><span class="section-kicker">Public Sources / 公开证据</span><h2>以下正文来自 ICS6201 <code>me</code> 分支的脱敏文档。</h2><p>内部仓库、节点、镜像、模型路径、运行标识、凭据与原始日志均不在页面中。公开数字保留原文定义和适用边界。</p></div><div class="button-row">{source_buttons}</div></section>
              {''.join(sections)}
              <section class="callout warning"><strong>结论边界</strong><p>{html.escape(boundary)}</p></section>
            </article><aside class="detail-sidebar"><div class="sidebar-card"><h3>Evidence Standard</h3><ul class="sidebar-list"><li><span>Problem</span><strong>可复现定义</strong></li><li><span>Method</span><strong>控制变量 / Oracle</strong></li><li><span>Result</span><strong>同口径对照</strong></li><li><span>Boundary</span><strong>不做过度外推</strong></li></ul></div><a class="button primary" href="../projects.html">返回全部项目</a><a class="button" href="../writing.html">技术文章与发布计划</a></aside></div></section>
          </main>{FOOTER}</body></html>'''
              write(f'projects/{slug}.html', content)

          project_page(
              slug='flashinfer-ftz',
              title='FlashInfer TP2 CUDA Graph Hang：从下游超时到 FTZ / Sentinel 根因',
              eyebrow='GPU Debugging · CUDA Graph · Collective Kernel',
              lead='通过 TP、Graph、Fusion 与版本的控制变量矩阵，将 vLLM rollout 的 sample_tokens timeout 收敛到 FlashInfer MNNVL fused allreduce + RMSNorm；进一步用位级判断、SASS 对照与两卡 graph replay 完成根因闭环。',
              role='Root-cause Isolation & Backport Validation',
              environment='2× GPU Reproducer · Model-level Replay',
              stack='vLLM · FlashInfer · CUDA Graph · SASS',
              status='公开脱敏案例 · 根因已闭环',
              metrics=[('0/3 → 2/2','16×16 FULL graph','修复前后'),('0/1 → 3/3','prompt-9 case','精确复现'),('8 → 0','目标 FTZ SASS predicate','位级验证'),('2/2 + 2/2','模型级 graph off / on','回归通过')],
              architecture_items=[('RPC Timeout','下游等待点'),('Control Matrix','TP / graph / fusion'),('GPU Root Cause','FTZ sentinel misclassification'),('Bitwise Fix','0x80000000 exact match'),('Regression','minimal + model replay')],
              documents=[('根因与修复公开版','doc/work_records/flashinfer/README.md','根因、修复与验证'),('机制详解','doc/work_records/flashinfer/flashinfer_mnnvl_lamport_ftz_hang_explained_20260717.md','FTZ、Lamport Sentinel 与永久轮询机制')],
              figures=[('assets/projects/flashinfer/cuda-graph-hang-flow.png','CUDA Graph hang 控制变量排查流程'),('assets/projects/flashinfer/rootcause-matrix.png','TP / Graph / Fusion 根因矩阵')],
              boundary='这项工作支持“定位并修复现用版本、完成回移和回归”，不声称本人原创 FlashInfer 上游 PR；CUDA Graph 的性能收益也不能归因于两行 sentinel 修复。'
          )

          project_page(
              slug='router-replay',
              title='R3 Router Replay：MoE-RL 训推路由一致性与概率漂移闭环',
              eyebrow='Flagship · RL Infra · MoE',
              lead='在 veRL + Megatron-LM + vLLM 的 MoE-RL 链路中打通 rollout route 采集、训练侧 observe/replay、response-mask 对齐和统一指标；以 A/B/C 对照区分自然路由差异、记录开销与 Replay 效果。',
              role='System Implementation & Experiment Design',
              environment='8× H200 Main Study · 32-card Smoke',
              stack='veRL · Megatron-LM · vLLM · PyTorch Distributed',
              status='公开聚合证据 · Eager 主口径',
              metrics=[('17%–19% → 0','route mismatch','20-step observe'),('36×–145×','f_tau_2 下降','R3 vs baseline'),('4×–7×','KL 下降','概率漂移'),('18','CPU contract tests','shape / mask / error')],
              architecture_items=[('vLLM Rollout','record [T,L,K] route'),('Data Protocol','response + route + mask'),('Megatron Trainer','observe natural route'),('R3 Replay','inject rollout expert ids'),('Metrics','mismatch / KL / stability')],
              documents=[('工程实现公开版','doc/work_records/r3/R3_工程实现公开版.md','工程实现与数据契约'),('实验结果公开版','doc/work_records/r3/R3_实验结果公开版.md','A/B/C 结果与适用边界'),('CUDA Graph 排障','doc/work_records/r3/R3_CUDA_Graph与集群排障公开版.md','稳定性与故障定位')],
              figures=[('assets/projects/router-replay/r3-engineering-progress.png','Router Replay 工程实现与 A/B/C 验证进度')],
              boundary='可证明路由执行路径和多项 logprob 指标显著对齐；不能据此声称 reward、准确率或最终收敛质量已经提高。32 卡结果是 5-step smoke，并存在约 8.1% 的短程吞吐开销。'
          )

          project_page(
              slug='oe-async',
              title='OE Async：GPU Token History、Triton Fused Hash 与多卡正确性',
              eyebrow='Inference Operator · Async Decode · Triton',
              lead='把 recent-token history 与 OE 输入构造留在 GPU 热路径，减少 GPU→CPU 等待和再次 H→D 回传；同时修复 mixed batch、请求恢复、slot reuse 与 reorder 下的跨 step 状态更新。',
              role='Operator Path & State-correctness Engineering',
              environment='TP1 / TP2 / TP4 · 28-shape Matrix',
              stack='vLLM-style Scheduler · Triton · CUDA · TP',
              status='公开聚合结果 · 多阶段验证',
              metrics=[('+5.0%','TP1 fused-hash vs sync','28-case strict matrix'),('+1.9%','TP1 fused vs async-unfused','融合增量'),('+4.6%','TP2 decode throughput','0 mismatch'),('+3.0%','TP4 decode throughput','0 mismatch')],
              architecture_items=[('Sampled Tokens','remain on GPU'),('Token History','cross-step state'),('Triton Fused Hash','construct OE inputs'),('Batch-invariant Gate','TP>1 safety path'),('3-stage Matrix','prefill / decode / mixed')],
              documents=[('OE Async 公开工作记录','doc/work_records/oe/README.md','实现、正确性矩阵、性能与边界')],
              figures=[],
              boundary='TP2/TP4 使用的是 async-unfused + batch-invariant 安全路径，不能写成多卡 fused-hash 已默认交付。Mixed 窗口存在回退，batch-invariant 本身也有约 5% 代价。'
          )

          project_page(
              slug='gemm-profiling',
              title='H200 MoE Grouped GEMM：统计口径纠偏、线上回放与 SM90 调优',
              eyebrow='GPU Performance · MoE · SM90',
              lead='先分离 T、T×top-k 与 DeepEP compact rows，再对稳态 NVTX range、线上 shape 回放和 Quack/CUTLASS 3.x 候选配置进行同口径分析，避免用错误工作量解释 Kernel 性能。',
              role='Profiling, Workload Reconstruction & Config Tuning',
              environment='NVIDIA H200 · 1,024 Forward Ranges',
              stack='Nsys · NVTX · Quack · CUTLASS · DeepEP',
              status='公开 CSV / 图表 / 脚本可复核',
              metrics=[('195,976 → 29,446','expanded vs compact rows','纠正 4×–6× 误判'),('66.5%','Quack pure GEMM MFU','选定 shape 集'),('+5.3%','目标 shape tuning','config-level'),('+1.84%','14 shapes × 3 distributions','聚合收益')],
              architecture_items=[('Router','T × top-k assignments'),('DeepEP Dispatch','compact TK_valid'),('Stable Profile','remove JIT / warmup'),('Local Replay','min / target / max'),('SM90 Search','tile / cluster / swizzle')],
              documents=[('H200 性能分析','doc/work_records/gemm_sonicmoe/H200_GEMM性能分析公开版.md','口径纠偏、Profile 与本地回放'),('Quack 调优记录','doc/work_records/gemm_sonicmoe/Quack调优开发记录公开版.md','14 shape × 3 分布配置调优')],
              figures=[('assets/projects/gemm/h200-path-overview.png','CUTLASS / Quack / DeepGEMM / SonicMoE 路径概览'),('assets/projects/gemm/quack-plan-summary.png','Quack H200 多 shape、多分布调优汇总')],
              boundary='66.5% 是 pure GEMM 的选定 shape 平均值，不能等同于 SonicMoE 端到端 MFU；1.84% 来自候选配置扩展，不是重写 CUDA/CuTe kernel。'
          )

          project_page(
              slug='deepgemm-offline',
              title='DeepGEMM 离线预编译：Cubin Bundle、Cold Compile 清零与 Wheel 交付',
              eyebrow='Inference Delivery · Offline Environment · DeepGEMM',
              lead='面向隔离网络的 H200 推理环境，将运行时 JIT shape 收集、cubin union、去重、SHA-256 校验、单卡/TP=2 覆盖与 wheel-only 安装串成可交付链路。',
              role='Build, Coverage & Offline Delivery Engineering',
              environment='H200 Single GPU + TP=2 Validation',
              stack='DeepGEMM · vLLM · Cubin · Wheel · SHA-256',
              status='公开交付总结 · 验证范围明确',
              metrics=[('109 → 359','union bundle kernels','约 +230%'),('8','单卡模型覆盖','验证范围 cold=0'),('TP=2','FP8 代表模型','cold=0'),('≈7.7×','precompiled vs cold load','启动阶段')],
              architecture_items=[('Shape Capture','runtime JIT inventory'),('Bundle Union','deduplicate cubins'),('Integrity','SHA-256 checks'),('Coverage','single GPU + TP=2'),('Delivery','two-wheel / combined wheel')],
              documents=[('专题 README','doc/work_records/deep_gemm/README.md','核心结果与交付边界'),('Wheel-only 交付说明','doc/work_records/deep_gemm/deep_gemm_wheel_only_delivery_20260521.md','离线安装与包内解析'),('Offline cubin 设计','doc/work_records/deep_gemm/deepgemm-offline-cubin-plan.md','预编译目录与 cache 设计')],
              figures=[],
              boundary='约 7.7× 是 cold/load 启动阶段差异，不是 hot GEMM TFLOPS 提升；8 个模型代表已验证覆盖，不表示所有 shape 或所有 GPU 架构均已支持。'
          )

          project_page(
              slug='quant-runtime',
              title='LLMQRT：W4A16 / W8A8 / FP8 量化推理 Runtime 与 H200 适配',
              eyebrow='Quantized Inference Runtime · CUDA · CUTLASS',
              lead='围绕模型加载、量化 schema、Linear 替换、AWQ GEMM/GEMV、CUTLASS INT8/FP8、Attention 后端与 KV Cache 建立轻量量化推理 Runtime，并在新一代 GPU 上补齐 kernel、单卡和 TP 验证。',
              role='Runtime Architecture & GPU Adaptation',
              environment='H200-oriented Validation · Single / Tensor Parallel',
              stack='PyTorch Extension · CUDA · CUTLASS · FA2/FA4/SDPA',
              status='公开架构与方法 · 性能按同口径复验',
              metrics=[('W4A16','AWQ weight-only','CUDA GEMM / GEMV'),('W8A8','SmoothQuant','CUTLASS INT8'),('FP8','dynamic / static','CUTLASS row/tensor-wise'),('FA2 / FA4 / SDPA','Attention fallback','prefill / decode')],
              architecture_items=[('Public API','AutoQuantForCausalLM'),('Model Layer','Qwen / Llama / OPT'),('Quant Linear','AWQ / SQ / FP8'),('Kernel Layer','CUDA / CUTLASS / Triton'),('Runtime','Attention + KV cache + generate')],
              documents=[('专题 README','doc/work_records/llmqrt/README.md','适配、正确性与公开边界'),('架构说明','doc/work_records/llmqrt/architecture.md','模块、加载、Attention 与量化路径'),('H200 开发记录','doc/work_records/llmqrt/h200_development_log.md','架构适配与测试方法')],
              figures=[],
              boundary='公开页面强调架构、正确性与适配方法；任何延迟或加速结论都需要在同一模型、版本、输入和 baseline 下重新测量，不能由单个 kernel 数字外推端到端收益。'
          )

          project_page(
              slug='drone-detection-pipeline',
              title='ICS6201 无人机检测：171K 样本数据工程与多 GPU 实验流水线',
              eyebrow='ML Systems · Data Pipeline · Multi-GPU Experiment',
              lead='将三套可见光无人机数据统一转换为 YOLO / COCO，构建环境自检、极小子集 smoke、多 GPU 调度、结果汇总与恢复机制；重点不是只报一个 mAP，而是让大规模实验可执行、可追溯、可恢复。',
              role='Pipeline, Data Engineering & Experiment Operations',
              environment='8× H200 · Shared Storage · 3 Datasets',
              stack='Ultralytics · Detectron2 · Python · ffmpeg',
              status='课程项目 · 核心 6 个训练任务完成',
              metrics=[('171,568','统一样本总量','3 datasets'),('18 days → 10–20 min','ARD-MAV 抽帧','批量 ffmpeg'),('14 / 14','端到端 smoke','约 5m07s'),('0.67682 / 64.566','RT-DETR / Faster R-CNN 均值','不同原生指标')],
              architecture_items=[('Raw Datasets','VOC + video/XML'),('Preparation','YOLO + COCO + fast frames'),('Validation','14-gate smoke'),('Scheduler','GPU worker launcher'),('Evidence','3 seeds + light metrics')],
              documents=[('项目完整总结','doc/work_records/ics6201/PROJECT_SUMMARY.md','数据、脚本、验证和核心结果'),('恢复优先级计划','doc/work_records/ics6201/TRAINING_RECOVERY_PRIORITY_PLAN_2026-06-05.md','中断恢复与资源调度')],
              figures=[('assets/projects/drone/primary-completion.png','RT-DETR-L 与 Faster R-CNN 三随机种子核心任务完成情况')],
              boundary='六模型 × 三随机种子是完整实验设计，但公开结果中只有 RT-DETR-L 与 Faster R-CNN 的三个随机种子核心任务全部完成；其余模型不能写成 18 次训练全部完成。两类 AP 采用各框架原生口径，不宜直接横向比较。'
          )

          def card(slug: str, number: str, badge: str, category: str, title: str, desc: str,
                   metrics: list[tuple[str, str]]) -> str:
              chips = ''.join(f'<div class="evidence-chip"><strong>{html.escape(v)}</strong><span>{html.escape(k)}</span></div>' for v, k in metrics)
              return f'''<a class="card project-card filter-item reveal" data-category="{category}" href="projects/{slug}.html"><div class="card-top"><span class="project-number">{number}</span><span class="badge engineering">{badge}</span></div><h3>{html.escape(title)}</h3><p>{html.escape(desc)}</p><div class="project-evidence">{chips}</div><div class="card-footer-link"><span>查看公开证据与结论边界</span><span>↗</span></div></a>'''

          cards = [
