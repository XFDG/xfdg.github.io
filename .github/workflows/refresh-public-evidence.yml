      - name: Validate public-site links, evidence boundaries and figures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup

          root = Path('.')
          pages = sorted(root.rglob('*.html'))
          assert len(pages) >= 15, len(pages)
          missing = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              soup = BeautifulSoup(text, 'html.parser')
              ids = [x.get('id') for x in soup.find_all(id=True)]
              assert len(ids) == len(set(ids)), f'duplicate id: {page}'
              for node in soup.find_all(['a','img','script','link']):
                  target = node.get('href') or node.get('src')
                  if not target or target.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  parsed = urlsplit(target)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  candidate = (page.parent / parsed.path).resolve()
                  if parsed.path.endswith('/'):
                      candidate /= 'index.html'
                  if not candidate.exists():
                      missing.append(f'{page}: {target}')
          assert not missing, '\n'.join(missing)

          required = {
              'index.html':['FlashInfer','Router Replay','OE Async','Grouped GEMM'],
              'projects/flashinfer-ftz.html':['FTZ','0x80000000','0/3'],
              'projects/router-replay.html':['17%–19%','36×–145×','不能据此声称'],
              'projects/oe-async.html':['TP2','0 mismatch','不能写成多卡 fused-hash'],
              'projects/gemm-profiling.html':['195,976','29,446','1,024'],
              'projects/deepgemm-offline.html':['109 → 359','7.7×'],
              'projects/drone-detection-pipeline.html':['171,568','14 / 14','不能写成 18 次训练全部完成'],
              'writing.html':['没有 CSDN / 知乎写入权限','CSDN','知乎']
          }
          for path, terms in required.items():
              text = (root/path).read_text(encoding='utf-8')
              for term in terms:
                  assert term in text, f'{path} missing {term}'

          figures = [
              'assets/projects/router-replay/r3-engineering-progress.png',
              'assets/projects/flashinfer/cuda-graph-hang-flow.png',
              'assets/projects/flashinfer/rootcause-matrix.png',
              'assets/projects/gemm/h200-path-overview.png',
              'assets/projects/gemm/quack-plan-summary.png',
              'assets/projects/drone/primary-completion.png'
          ]
          for path in figures:
              f = root/path
              assert f.exists() and f.stat().st_size > 1000, path

          public_text = '\n'.join((root/p).read_text(encoding='utf-8') for p in required)
          banned = ['yzhao04', '/volume/yzhao04', '32196', '32198', 'API_KEY=', 'BEGIN OPENSSH PRIVATE KEY']
          assert not any(x in public_text for x in banned)
          print(f'validated {len(pages)} HTML pages and {len(figures)} public figures')
          PY

