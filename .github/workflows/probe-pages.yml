name: Probe and finalize GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure, verify and record Pages state
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://xfdg.github.io/
        shell: bash
        run: |
          set -u
          action=get-existing
          configure_output=""

          pages_before="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"
          pages_before_code=$?
          if [[ $pages_before_code -ne 0 ]]; then
            action=create
            configure_output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f 'source[branch]=main' -f 'source[path]=/' 2>&1)"
            configure_code=$?
          else
            action=update
            configure_output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f 'source[branch]=main' -f 'source[path]=/' 2>&1)"
            configure_code=$?
          fi

          build_output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" 2>&1)"
          build_code=$?

          live=false
          http_status=000
          for attempt in $(seq 1 36); do
            http_status="$(curl -L -sS -o /tmp/site-index.html -w '%{http_code}' "$SITE_URL" || true)"
            if [[ "$http_status" == 200 ]] && grep -q 'Haoran Feng' /tmp/site-index.html \
              && grep -q 'blog.csdn.net/XFDG01' /tmp/site-index.html \
              && grep -q 'zhihu.com/people/xian-feng-dao-gu-73-49' /tmp/site-index.html; then
              live=true
              break
            fi
            sleep 5
          done

          pages_after="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"
          pages_after_code=$?
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --argjson live "$live" --arg site_url "$SITE_URL" --arg http_status "$http_status" \
            --arg action "$action" --arg configure_output "$configure_output" --argjson configure_code "${configure_code:-0}" \
            --arg pages_before "$pages_before" --argjson pages_before_code "$pages_before_code" \
            --arg build_output "$build_output" --argjson build_code "$build_code" \
            --arg pages_after "$pages_after" --argjson pages_after_code "$pages_after_code" \
            --arg checked_at "$checked_at" \
            '{live:$live,site_url:$site_url,http_status:$http_status,action:$action,configure:{code:$configure_code,output:$configure_output},pages_before:{code:$pages_before_code,output:$pages_before},build:{code:$build_code,output:$build_output},pages_after:{code:$pages_after_code,output:$pages_after},checked_at:$checked_at}' \
            > pages-probe.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-probe.json
          git commit -m 'Record GitHub Pages probe [skip ci]'
          git push origin HEAD:main

          [[ "$live" == true ]]
