name: Render editorial design preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-editorial-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          echo $! > /tmp/site-server.pid
          sleep 1

      - name: Render desktop and mobile previews
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo 'No Chromium browser available' >&2
            exit 1
          fi
          mkdir -p preview
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1200 --screenshot=preview/home-desktop.png \
            http://127.0.0.1:8000/
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1200 --screenshot=preview/projects-desktop.png \
            http://127.0.0.1:8000/projects.html
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --screenshot=preview/home-mobile.png \
            http://127.0.0.1:8000/
          test -s preview/home-desktop.png
          test -s preview/projects-desktop.png
          test -s preview/home-mobile.png

      - uses: actions/upload-artifact@v4
        with:
          name: editorial-preview
          path: preview/
          retention-days: 1
