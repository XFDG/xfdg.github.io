name: Retry research update with corrected validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-research-update.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML tooling
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Execute reviewed generator with corrected status validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/add-research-and-fix-dates.yml').read_text(encoding='utf-8')
          match = re.search(r"python - <<'PY'\n(.*?)\n          PY", source, flags=re.S)
          if not match:
              raise SystemExit('embedded generator not found')
          program = textwrap.dedent(match.group(1))
          program = program.replace(
              "assert 'Under Review' in (ROOT / 'research.html').read_text(encoding='utf-8')",
              "assert 'under review' in (ROOT / 'research.html').read_text(encoding='utf-8').lower()",
          )
          exec(compile(program, '<research-site-generator>', 'exec'), {})
          PY

      - name: Commit website update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experience.html resume.html writing.html research.html sitemap.xml
          git commit -m 'Add AAAI 2027 submission and correct MUSA internship dates'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
