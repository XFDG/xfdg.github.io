name: Apply compact high-density redesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-compact-redesign.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: compact-portfolio-redesign
  cancel-in-progress: false

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML tooling
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Generate compact pages
        run: python scripts/compact_redesign.py

      - name: Validate high-density layout and public contribution claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          root = Path('.')
          checks = {
              'index.html': ['Mooncake', '2 merged', 'Selected work'],
              'projects.html': ['Mooncake', 'OPEN SOURCE', 'work-list'],
              'projects/mooncake-contributions.html': ['#3660', '#3604', 'MERGED', '#3726'],
              'experience.html': ['Open Source / 开源贡献', 'Mooncake'],
              'resume.html': ['Mooncake Contributor', '2 个 PR 已合并'],
              'styles.css': ['COMPACT-REDESIGN-2026', '.work-row', '.compact-hero'],
          }
          for path, terms in checks.items():
              text = (root / path).read_text(encoding='utf-8')
              for term in terms:
                  assert term in text, f'{path} missing {term}'

          for path in root.rglob('*.html'):
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              assert soup.body and 'compact-site' in soup.body.get('class', []), path

          public = '\n'.join((root / p).read_text(encoding='utf-8') for p in checks if p.endswith('.html'))
          banned = ['Mooncake maintainer', 'all PRs merged', '14 merged', '上游维护者']
          assert not any(term in public for term in banned)
          print('validated compact portfolio redesign')
          PY

      - name: Commit website update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.html experience.html resume.html styles.css sitemap.xml projects/mooncake-contributions.html scripts/compact_redesign.py
          git commit -m 'Redesign portfolio and add Mooncake contributions'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
