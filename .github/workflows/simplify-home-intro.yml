name: Simplify homepage intro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/simplify-home-intro.yml

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify hero copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '香港中文大学（深圳）集成电路与系统硕士在读，本科毕业于山东大学电子科学与技术专业，并辅修计算机科学与技术。关注大模型训练推理、RL Infra、GPU Kernel、分布式存储与性能工程。'
          new = '港中深集成电路硕士在读，关注大模型系统与 GPU 性能工程。'
          if old not in text:
              raise SystemExit('old hero copy not found')
          text = text.replace(old, new, 1)
          text = text.replace('<div><dt>Education</dt><dd>CUHK-Shenzhen · Shandong University</dd></div>', '', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify homepage introduction'
          git push origin HEAD:main
      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
