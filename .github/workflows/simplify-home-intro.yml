name: Simplify homepage intro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/simplify-home-intro.yml

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify hero copy
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          p = Path('index.html')
          soup = BeautifulSoup(p.read_text(encoding='utf-8'), 'html.parser')

          hero = soup.select_one('.hero-statement')
          if not hero:
              raise SystemExit('hero statement not found')
          hero.string = '港中深集成电路硕士在读，关注大模型系统与 GPU 性能工程。'

          facts = soup.select_one('.hero-facts')
          if facts:
              for row in list(facts.find_all('div', recursive=False)):
                  dt = row.find('dt')
                  if dt and dt.get_text(' ', strip=True) == 'Education':
                      row.decompose()

          p.write_text(str(soup), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify homepage introduction'
          git push origin HEAD:main
      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
