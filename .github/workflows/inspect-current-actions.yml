name: Inspect current Actions queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-current-actions.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record latest Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=40" \
            --jq '{checked_at: now|todate, runs: [.workflow_runs[] | {id,name,status,conclusion,head_sha,created_at,updated_at,html_url}]}' \
            > current-actions.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-actions.json
          git commit -m 'Record current Actions queue [skip ci]'
          git push origin HEAD:main
