name: Deduplicate research and clarify open-source classification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-research-classification.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Remove duplicate research blocks and classify MUSA correctly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          def load(path):
              return BeautifulSoup(Path(path).read_text(encoding='utf-8'), 'html.parser')

          def save(path, doc):
              Path(path).write_text(str(doc), encoding='utf-8')

          # Homepage: one dedicated Research section; Open Source is Mooncake-only.
          doc = load('index.html')
          musa = doc.find('a', href='projects/musa-extension.html')
          if musa:
              badge = musa.select_one('.work-badge')
              if badge: badge.string = 'FRAMEWORK'
              desc = musa.select_one('.work-main small')
              if desc:
                  desc.string = '摩尔线程实习期间负责 TensorFlow MUSA 后端、算子、Fusion、HostMemory、稳定性与 Kernel 调试工具。'

          two_col = doc.select_one('.two-column-dense')
          if two_col:
              columns = two_col.find_all('div', recursive=False)
              if len(columns) >= 2:
                  right = columns[1]
                  heading = right.select_one('.dense-heading')
                  if heading:
                      h2 = heading.find('h2')
                      if h2: h2.string = 'Open source'
                      label = heading.find('span')
                      if label: label.string = 'Accepted upstream contributions'
                  listing = right.select_one('.os-list')
                  if listing:
                      listing.clear()
                      a = doc.new_tag('a', href='projects/mooncake-contributions.html')
                      strong = doc.new_tag('strong'); strong.string = 'Mooncake'
                      span = doc.new_tag('span'); span.string = '2 个 RDMA 生命周期与故障恢复修复已合入上游；其他提交按 GitHub 当前状态标注。'
                      b = doc.new_tag('b'); b.string = 'Evidence ↗'
                      a.extend([strong, span, b])
                      listing.append(a)
          save('index.html', doc)

          # Experience: retain the earlier concise publication block only.
          doc = load('experience.html')
          duplicate = doc.find('section', id='research-submission')
          if duplicate:
              duplicate.decompose()
          open_section = doc.find('section', id='open-source-contributions')
          if open_section:
              h2 = open_section.find('h2')
              if h2: h2.string = 'Mooncake upstream contributions.'
          save('experience.html', doc)

          # Assertions.
          index = Path('index.html').read_text(encoding='utf-8')
          experience = Path('experience.html').read_text(encoding='utf-8')
          assert index.count('From Structure to Preference: Token Weighting for Chain-of-Thought Distillation in Large Language Models') == 1
          assert '<span class="work-badge">FRAMEWORK</span>' in index
          assert 'Research &amp; open source' not in index
          assert 'Accepted upstream contributions' in index
          assert 'research-submission' not in experience
          assert experience.count('From Structure to Preference: Token Weighting for Chain-of-Thought Distillation in Large Language Models') == 1
          print('research and open-source classification cleaned')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experience.html
          git commit -m 'Deduplicate research and clarify open-source classification'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
