name: Retry profile corrections with scoped course-code validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-profile-corrections.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install HTML tooling
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Execute reviewed update with corrected validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/apply-profile-corrections.yml').read_text(encoding='utf-8')
          match = re.search(r"python - <<'PY'\n(.*?)\n          PY", source, flags=re.S)
          if not match:
              raise SystemExit('embedded update script not found')
          script = textwrap.dedent(match.group(1))
          script = script.replace(
              "assert 'ICS6201' not in projects and 'ICS6201' not in drone",
              "assert 'ICS6201 无人机检测' not in projects and 'ICS6201 无人机检测' not in drone",
          )
          exec(compile(script, '<profile-corrections>', 'exec'), {})
          PY

      - name: Commit website update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.html experience.html resume.html projects/drone-detection-pipeline.html projects/mirage-contribution.html sitemap.xml
          git commit -m 'Add Mirage contribution and undergraduate background'
          git push origin HEAD:main

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
