# Pages CMS is an optional GitHub-authenticated editor, not a public login form.
# This repository is PUBLIC. published=false does not make GitHub drafts private.
media:
  input: assets/blog/images
  output: https://xfdg.github.io/assets/blog/images
  categories: [image]
  extensions: [png, jpg, jpeg, webp, gif]
  rename: true
content:
  - name: posts
    label: 博客文章 / Blog posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, date, published, lang]
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: slug
        label: 固定地址 / URL slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "例如 cuda-graph-notes；发布后保持不变。地址为 /blog/cuda-graph-notes/。"
      - name: date
        label: 发布日期 / Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期 / Updated (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: lang
        label: 正文语言 / Language
        type: select
        default: zh
        options:
          values:
            - name: zh
              label: 中文
            - name: en
              label: English
      - name: summary
        label: 简短摘要 / Summary
        type: text
        options:
          maxlength: 400
      - name: tags
        label: 标签 / Tags
        type: string
        list: true
      - name: cover
        label: 封面（可选）/ Cover
        type: image
      - name: published
        label: 发布到网站 / Publish to website
        type: boolean
        default: false
        description: "打开并保存后自动构建。关闭只会隐藏网页，源文件和历史仍公开；私密草稿请留在本地。"
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
        description: "可切换 Source 编辑 Markdown。代码块和 LaTeX 公式建议在 Source 中编辑。"
      - name: translation
        label: 另一语言文章的 slug（可选）/ Translation slug
        type: string
        description: "仅在另一语言文章确实存在时填写，两篇需互相填写。无需为了双语导航重复发布原文。"
      - name: csdn
        label: 已发布 CSDN 地址（可选）
        type: string
      - name: zhihu
        label: 已发布知乎地址（可选）
        type: string
      - name: luogu
        label: 已发布洛谷地址（可选）
        type: string
